server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  recommendation-service:
    url: http://localhost:8082
  promo-service:
    url: http://localhost:8083

resilience4j:
  circuitbreaker:
    instances:
      bankClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      promoClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        # Bộ lọc Lỗi Hệ Thống: Cần tính vào Tỉ lệ lỗi % (Record Failure)
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # Bộ lọc Lỗi Nghiệp Vụ: Cần phớt lờ, KHÔNG tính lỗi (Ignore Exception)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound
          - microservice.orderservice.exception.VoucherNotFoundException
